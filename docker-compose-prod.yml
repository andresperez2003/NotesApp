services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=${DB_URL}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - MAIL_SERVICE=${MAIL_SERVICE}
      - MAIL_SECRET_KEY=${MAIL_SECRET_KEY}
      - VALIDATION_FRONTEND=${VALIDATION_FRONTEND}
      - CHANGE_PASSWORD_FRONTEND=${CHANGE_PASSWORD_FRONTEND}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend

  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: notes
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend

volumes:
  db_data:

# Red compartida con MailerNodeJs. Crearla una vez: docker network create backend
networks:
  backend:
    external: true
